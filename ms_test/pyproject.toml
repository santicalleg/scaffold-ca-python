[project]
name = "ms_test"
version = "0.1.0"
description = "Clean Architecture Python project"
requires-python = ">=3.13"
dependencies = [
    "dependency-injector==4.49.0",
    "pydantic-settings==2.13.1",
    "fastapi[standard]>=0.135.2",
    "uvicorn[standard]>=0.20",
]

[project.scripts]
ms_test = "ms_test.server:start_server"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.10",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.scaffold-ca-python]
name = "ms_test"
python_package = "ms_test"
created_at = "2026-04-14T22:14:59.158886+00:00"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "ANN",
]
ignore = [
    "ANN101",
    "ANN102",
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**/*.py" = [
    "ANN",
]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.coverage.run]
source = [
    "ms_test",
]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
addopts = "--cov=ms_test --cov-fail-under=80"
testpaths = [
    "src/tests",
]
